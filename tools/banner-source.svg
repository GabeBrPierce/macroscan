<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dccb"/>
      <stop offset="0.45" stop-color="#ece2ea"/>
      <stop offset="1" stop-color="#d9e9ef"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.16" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fff3e0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a8477"/>
      <stop offset="1" stop-color="#e8871e"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a2b33" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#sun)"/>

  <!-- mountains (back, hazy) -->
  <g>
    <polygon points="-40,360 180,150 330,300 470,180 640,340 820,190 1000,330 1180,200 1320,360 1320,640 -40,640" fill="#c3ced6"/>
    <polygon points="180,150 250,215 210,235 150,215" fill="#ffffff" opacity="0.9"/>
    <polygon points="470,180 545,255 495,275 425,250" fill="#ffffff" opacity="0.85"/>
    <polygon points="820,190 885,255 840,272 775,250" fill="#ffffff" opacity="0.85"/>
    <polygon points="1180,200 1240,262 1205,275 1150,255" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- mountains (mid) -->
  <polygon points="-40,430 220,300 430,410 640,300 880,430 1080,330 1320,440 1320,640 -40,640" fill="#9db6ab"/>
  <!-- rolling hill (front) -->
  <path d="M-40,520 C 220,455 430,540 640,505 C 880,465 1080,545 1320,495 L1320,640 L-40,640 Z" fill="#6fa07d"/>
  <path d="M-40,560 C 260,515 470,585 720,555 C 980,525 1150,585 1320,560 L1320,640 L-40,640 Z" fill="#5c8e6c"/>

  <!-- ==== brand block (left) ==== -->
  <!-- app icon -->
  <g filter="url(#soft)">
    <svg x="326" y="120" width="210" height="210" viewBox="0 0 256 256">
      <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tileB)" stroke="#e2e8ea" stroke-width="2"/>
      <g fill="none" stroke-width="15" stroke-linecap="round">
        <path d="M 88,62.7 A 80,80 0 0 0 94.2,204.5" stroke="#1a8477"/>
        <path d="M 168,62.7 A 80,80 0 0 1 161.8,204.5" stroke="#e8871e"/>
      </g>
      <g fill="#1a8477">
        <ellipse cx="110" cy="96" rx="20" ry="27"/>
        <rect x="103" y="112" width="14" height="86" rx="7"/>
      </g>
      <g fill="#1a8477">
        <rect x="137" y="66" width="6" height="46" rx="3"/>
        <rect x="149" y="66" width="6" height="46" rx="3"/>
        <rect x="161" y="66" width="6" height="46" rx="3"/>
        <path d="M137 104 h30 a6 6 0 0 1 6 6 v6 a21 15 0 0 1 -42 0 v-6 a6 6 0 0 1 6 -6 z"/>
        <rect x="145" y="120" width="14" height="78" rx="7"/>
      </g>
      <g>
        <path d="M128 182c-13 8-19 19-19 30 0 13 9 22 19 22s19-9 19-22c0-6-3-11-7-16-2 6-5 9-8 9 4-9 0-18-4-23z" fill="#2fa894"/>
        <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M128 227 v-20"/><path d="M120 214 l8 -8 8 8"/>
        </g>
      </g>
    </svg>
  </g>

  <text x="431" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#15564d">MacroScan</text>
  <text x="431" y="446" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#3f5a55">Calorie, macro &amp; weight tracker</text>
  <text x="431" y="491" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a8477">Scan barcodes &#183; Track macros &#183; Reach your goal</text>

  <!-- ==== dashboard cards (right) ==== -->
  <!-- calories card -->
  <g filter="url(#soft)">
    <rect x="812" y="96" width="404" height="196" rx="24" fill="#ffffff" fill-opacity="0.86"/>
  </g>
  <text x="844" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#8b9aa5" letter-spacing="1">TODAY&#8217;S CALORIES</text>
  <text x="844" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#15564d">1,850</text>
  <text x="844" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#3f5a55">of 2,000 kcal</text>
  <!-- ring -->
  <g transform="translate(1140,194)">
    <circle r="56" fill="none" stroke="#e7edf1" stroke-width="16"/>
    <circle r="56" fill="none" stroke="url(#ringc)" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="325 352" transform="rotate(-90)"/>
    <text x="0" y="8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#15564d">92%</text>
  </g>

  <!-- weight trend card -->
  <g filter="url(#soft)">
    <rect x="812" y="320" width="404" height="196" rx="24" fill="#ffffff" fill-opacity="0.86"/>
  </g>
  <text x="844" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#8b9aa5" letter-spacing="1">WEIGHT TREND</text>
  <text x="844" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#1a8477">&#8722;4.2 lb</text>
  <text x="844" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#3f5a55">on track for your goal</text>
  <!-- mini line chart: actual (teal, trending down) + projected (blue dashed) -->
  <g transform="translate(1040,346)">
    <polyline fill="none" stroke="#1a8477" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      points="0,30 28,42 56,38 84,56 112,62 140,80"/>
    <polyline fill="none" stroke="#5b9dff" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"
      points="140,80 176,102"/>
    <circle cx="140" cy="80" r="5" fill="#1a8477"/>
    <circle cx="176" cy="102" r="4.5" fill="#5b9dff"/>
  </g>
</svg>
